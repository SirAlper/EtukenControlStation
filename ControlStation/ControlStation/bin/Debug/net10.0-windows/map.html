<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>İHA Taktik Ekranı</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Tam ekran harita, koyu arka plan */
        body, html, #map {
            height: 100%;
            margin: 0;
            background: #0b0e14;
            overflow: hidden;
        }

        /* ANA Uçağın modern neon stili */
        .uav-icon {
            filter: drop-shadow(0 0 7px #00e5ff);
            transition: all 0.2s linear;
        }

        /* Modern Karanlık Tema Popup/Tooltip */
        .leaflet-tooltip {
            background: rgba(11, 14, 20, 0.9) !important;
            color: #ffffff !important;
            border: 1px solid #1e293b !important;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. HARİTA VE ANA İHA KURULUMU
        // ==========================================
        var map = L.map('map', { zoomControl: false }).setView([41.5087, 36.1183], 16);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '©OpenStreetMap ©CartoDB'
        }).addTo(map);

        // Ana Uçağın İzi
        var pathLine = L.polyline([], {
            color: '#00e5ff',
            weight: 2,
            opacity: 0.5,
            dashArray: '5, 10'
        }).addTo(map);

        // Ana Uçak İkonu ve İşaretçisi
        var uavSvg = `
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="#00e5ff" stroke="#0b0e14" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>`;

        var uavIcon = L.divIcon({
            html: uavSvg,
            className: 'uav-icon',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        var uavMarker = L.marker([41.5087, 36.1183], { icon: uavIcon }).addTo(map);
        uavMarker.bindTooltip("BİZİM İHA", { permanent: false, direction: "top", offset: [0, -10] });

        // ==========================================
        // 2. RAKİP İHA'LARI TUTACAĞIMIZ SÖZLÜK (HAFIZA)
        // ==========================================
        var rakipIhalar = {};
        /* Örnek Yapı:
           rakipIhalar["Rakip1"] = { marker: obj, path: obj };
        */

        // Rakip Uçaklar için dinamik renkli SVG üreten fonksiyon
        function getRakipIcon(renkKodu) {
            var svg = `
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" fill="${renkKodu}" stroke="#0b0e14" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>`;

            return L.divIcon({
                // Drop-shadow (Neon parlama) efektini de o renge boyuyoruz
                html: `<div style="filter: drop-shadow(0 0 7px ${renkKodu}); transition: all 0.2s linear; width:100%; height:100%;">${svg}</div>`,
                className: '', // Boş bırakıyoruz ki CSS çakışmasın
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        // ============================================================
        // C# TARAFINDAN ÇAĞRILACAK FONKSİYONLAR
        // ============================================================

        // ANA UÇAĞI OYNATAN FONKSİYON
        function updateUAV(lat, lng, yaw, alt, speed) {
            var newPos = [lat, lng];

            uavMarker.setLatLng(newPos);
            var iconElement = uavMarker.getElement();
            if (iconElement) {
                iconElement.style.transformOrigin = "center center";
                iconElement.style.transform += ` rotate(${yaw}deg)`;
            }

            pathLine.addLatLng(newPos);

            setTimeout(() => {
                var currentLatLngs = pathLine.getLatLngs();
                if (currentLatLngs.length > 0) {
                    currentLatLngs.shift();
                    pathLine.setLatLngs(currentLatLngs);
                }
            }, 15000);

            uavMarker.setTooltipContent(`BİZİM İHA\nALT: ${alt.toFixed(1)}m | HIZ: ${speed.toFixed(1)}m/s`);
            map.panTo(newPos, { animate: true, duration: 0.5 });
        }


        // YENİ: RAKİP UÇAĞI OYNATAN FONKSİYON
        // C#'tan rakibin ID'sini (örneğin "Takim_42") ve Rengini ("#ff0055") göndereceksin
        function updateRakip(id, lat, lng, yaw, alt, speed, renk) {
            var newPos = [lat, lng];

            // Eğer bu ID'ye sahip rakip haritada yoksa, İLK KEZ OLUŞTUR
            if (!rakipIhalar[id]) {

                // Rakibe özel Rota Çizgisi oluştur
                var rPath = L.polyline([], {
                    color: renk,
                    weight: 2,
                    opacity: 0.5,
                    dashArray: '5, 10'
                }).addTo(map);

                // Rakibe özel İkon ve Marker oluştur
                var rIcon = getRakipIcon(renk);
                var rMarker = L.marker(newPos, { icon: rIcon }).addTo(map);

                // ==========================================
                // BÜYÜ BURADA: RAKİBE TOOLTIP (BİLGİ ETİKETİ) BAĞLA
                // permanent: false -> Sadece Mouse ile üstüne gelince gösterir
                // ==========================================
                rMarker.bindTooltip("", { permanent: false, direction: "top", offset: [0, -10] });

                // Rakibi Hafızaya (Sözlüğe) Kaydet
                rakipIhalar[id] = { marker: rMarker, path: rPath };
            }

            // Rakibi hafızadan çağır ve GÜNCELLE
            var rakip = rakipIhalar[id];

            // Konumu güncelle
            rakip.marker.setLatLng(newPos);

            // Bilgi Kutusunun içeriğini HTML formatında şıkça güncelle
            rakip.marker.setTooltipContent(`<div style="text-align:center;"><b>${id}</b><br>ALT: ${alt.toFixed(1)}m | HIZ: ${speed.toFixed(1)}m/s</div>`);

            // Açıyı döndür
            var iconElement = rakip.marker.getElement();
            if (iconElement) {
                var innerDiv = iconElement.querySelector('div');
                if (innerDiv) {
                    innerDiv.style.transformOrigin = "center center";
                    innerDiv.style.transform = `rotate(${yaw}deg)`;
                }
            }

            // Rakibin kendi rota çizgisine yeni nokta ekle
            rakip.path.addLatLng(newPos);

            // Rakibin duman izini 15 saniye sonra kendi polyline'ından sil
            setTimeout(() => {
                var currentLatLngs = rakip.path.getLatLngs();
                if (currentLatLngs.length > 0) {
                    currentLatLngs.shift();
                    rakip.path.setLatLngs(currentLatLngs);
                }
            }, 15000);
        }
    </script>
</body>
</html>
